<header data-engine-header class="app-header">
    <div class="header-inner">
      <button class="brand" data-view="home"><span class="brand-icon" data-brand-icon aria-hidden="true"></span>물음샘 영어</button>
      <nav aria-label="영어 연습 메뉴">
        <button data-view="home" aria-label="연습">연습</button>
        <button data-view="wrong" aria-label="기록">기록</button>
        <button type="button" class="plain-button settings-button" id="home-settings" data-settings aria-label="화면 및 입력 설정" title="화면 및 입력 설정"></button>
      </nav>
    </div>
  </header>
  <div id="app"></div>
  <dialog class="preferences-dialog" id="preferences" aria-labelledby="preferences-title">
    <section class="preferences-section" aria-labelledby="settings-service"><h3 id="settings-service">문제 설정</h3>
      <label class="mix-toggle settings-toggle"><span>범위 수동 설정</span><input id="manual-setting" type="checkbox" role="switch"></label>
    </section>
  </dialog>
  <dialog id="segment-reset-dialog" aria-labelledby="segment-reset-title"><h2 id="segment-reset-title">이 구간의 학습을 초기화할까요?</h2><p>선택한 학습 방식과 범위의 진행 상태가 초기화됩니다. 다른 학습 기록과 북마크는 유지됩니다.</p><form method="dialog" class="dialog-actions"><button class="button secondary" value="cancel" autofocus><span class="icon-slot" data-icon="close"></span>취소</button><button class="button danger" value="reset"><span class="icon-slot" data-icon="trash"></span>구간 초기화</button></form></dialog>
  <dialog id="replace-round" aria-labelledby="replace-title">
    <h2 id="replace-title">새 학습을 시작할까요?</h2>
    <p>같은 방식의 진행 중인 학습을 새로 시작합니다.</p>
    <form method="dialog" class="dialog-actions">
      <button class="button secondary" value="cancel" autofocus><span class="icon-slot" data-icon="close"></span>취소</button>
      <button class="button primary action-start" value="replace">새 학습 시작</button>
    </form>
  </dialog>
