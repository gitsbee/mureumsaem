name: Deploy Harueum Study to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify Firestore permissions with demo data
        run: npm run test:rules
      - name: Verify browser flows with demo services
        run: npm run test:e2e

  build:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out main
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Select production and preview paths
        id: routes
        env:
          DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$DOMAIN" ]; then
            printf 'production=/\npreview=/dev/\norigin=https://%s\n' "$DOMAIN" >> "$GITHUB_OUTPUT"
          else
            printf 'production=/%s/\npreview=/%s/dev/\norigin=https://gitsbee.github.io\n' "$REPOSITORY_NAME" "$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build with Firebase configuration
        env:
          VITE_BASE_PATH: ${{ steps.routes.outputs.production }}
          VITE_SITE_ORIGIN: ${{ steps.routes.outputs.origin }}
          VITE_NEIS_WORKER_URL: ${{ vars.VITE_NEIS_WORKER_URL }}
          VITE_LEARNING_WORKER_URL: ${{ vars.VITE_LEARNING_WORKER_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: |
          node scripts/check-firebase-env.mjs
          npm run build
      - name: Check out develop for the preview
        uses: actions/checkout@v6
        with:
          ref: develop
          path: preview
      - name: Build the development preview
        working-directory: preview
        env:
          VITE_BASE_PATH: ${{ steps.routes.outputs.preview }}
          VITE_SITE_ORIGIN: ${{ steps.routes.outputs.origin }}
          VITE_PREVIEW: 'true'
          VITE_NEIS_WORKER_URL: ${{ vars.VITE_DEV_NEIS_WORKER_URL }}
          VITE_LEARNING_WORKER_URL: ${{ vars.VITE_DEV_LEARNING_WORKER_URL }}
          PRODUCTION_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_DEV_FIREBASE_API_KEY || vars.VITE_DEV_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_DEV_FIREBASE_AUTH_DOMAIN || vars.VITE_DEV_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_DEV_FIREBASE_PROJECT_ID || vars.VITE_DEV_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_DEV_FIREBASE_APP_ID || vars.VITE_DEV_FIREBASE_APP_ID }}
        run: |
          if [ -n "$VITE_FIREBASE_PROJECT_ID" ]; then
            if [ "$VITE_FIREBASE_PROJECT_ID" = "$PRODUCTION_PROJECT_ID" ]; then
              echo 'The preview requires a separate Firebase project.' >&2
              exit 1
            fi
            node scripts/check-firebase-env.mjs
          fi
          npm ci
          npm run build
          mv dist ../dist/dev
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
